name: desktop-portable-release

on:
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: Official sing-box version without the leading v (for example 1.13.19)
        required: true
        default: "1.13.19"
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Derive release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      git_commit: ${{ steps.version.outputs.git_commit }}
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      sing_box_version: ${{ steps.version.outputs.sing_box_version }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive Android-compatible Git version
        id: version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_SING_BOX_VERSION: ${{ inputs.sing_box_version }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "Portable releases must run from the default branch: ${expected_ref}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "A complete Git history is required for versionCode" >&2
            exit 1
          fi
          if [[ ! "${INPUT_SING_BOX_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "sing_box_version must use major.minor.patch without a leading v" >&2
            exit 1
          fi
          version_code="$(git rev-list --count HEAD)"
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Git commit count is outside the supported versionCode range" >&2
            exit 1
          fi
          git_commit="$(git rev-parse HEAD)"
          commit_date="$(git show -s --format=%cs HEAD)"
          if [[ ! "${git_commit}" =~ ^[0-9a-f]{40,64}$ || ! "${commit_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Git returned invalid release metadata" >&2
            exit 1
          fi
          version_name="${commit_date//-/.}-${git_commit:0:8}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          release_tag="desktop-v${version_code}-${version_name}"
          previous_code="$(
            while IFS= read -r tag; do
              if [[ "${tag}" != "${release_tag}" && "${tag}" =~ ^desktop-v([0-9]+)- ]]; then
                printf '%s\n' "${BASH_REMATCH[1]}"
              fi
            done < <(git tag --list 'desktop-v*-*') | sort -n | tail -1
          )"
          if [[ -n "${previous_code}" ]] && (( version_code <= previous_code )); then
            echo "versionCode ${version_code} must exceed prior desktop release ${previous_code}" >&2
            exit 1
          fi
          {
            echo "version_code=${version_code}"
            echo "version_name=${version_name}"
            echo "git_commit=${git_commit}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "release_tag=${release_tag}"
            echo "sing_box_version=${INPUT_SING_BOX_VERSION}"
          } >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify release source
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPNODE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      TOPNODE_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      TOPNODE_GIT_COMMIT: ${{ needs.metadata.outputs.git_commit }}
      TOPNODE_SING_BOX_VERSION: ${{ needs.metadata.outputs.sing_box_version }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy

      - name: Install Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Validate release helpers
        run: python3 -m py_compile scripts/fetch-sing-box.py scripts/package-portable.py scripts/render-release-config.py

      - name: Format
        run: cargo fmt --all --check

      - name: Render release configuration for Rust contract tests
        shell: bash
        run: |
          cp config/desktop-config.json "${RUNNER_TEMP}/desktop-config.template.json"
          python3 scripts/render-release-config.py \
            --template "${RUNNER_TEMP}/desktop-config.template.json" \
            --output config/desktop-config.json \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${{ needs.metadata.outputs.release_tag }}" \
            --version-code "${{ needs.metadata.outputs.version_code }}" \
            --version-name "${{ needs.metadata.outputs.version_name }}" \
            --update-info "Desktop portable release ${{ needs.metadata.outputs.version_name }}"

      - name: Test
        run: cargo test --workspace --exclude topnode-desktop --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.platform_label }}
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform_label: windows-x86_64
            sing_box_asset: windows-amd64.zip
            rustflags: -C target-feature=+crt-static
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform_label: windows-aarch64
            sing_box_asset: windows-arm64.zip
            rustflags: -C target-feature=+crt-static
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_label: linux-x86_64
            sing_box_asset: linux-amd64.tar.gz
            rustflags: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_label: linux-aarch64
            sing_box_asset: linux-arm64.tar.gz
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform_label: macos-x86_64
            sing_box_asset: darwin-amd64.tar.gz
            rustflags: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            platform_label: macos-aarch64
            sing_box_asset: darwin-arm64.tar.gz
            rustflags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TOPNODE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      TOPNODE_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      TOPNODE_GIT_COMMIT: ${{ needs.metadata.outputs.git_commit }}
      TOPNODE_SING_BOX_VERSION: ${{ needs.metadata.outputs.sing_box_version }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
      RUST_TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain and target
        run: rustup toolchain install 1.92.0 --profile minimal && rustup target add ${{ matrix.target }} --toolchain 1.92.0

      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Fetch and verify official sing-box core
        run: python scripts/fetch-sing-box.py --version "${{ needs.metadata.outputs.sing_box_version }}" --asset "sing-box-${{ needs.metadata.outputs.sing_box_version }}-${{ matrix.sing_box_asset }}" --check-config "config/sing-box.example.json" --output ".release/sing-box"

      - name: Stage Windows portable layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stage.ps1 -SingBoxPath ".release/sing-box/core/sing-box.exe" -SingBoxLicensePath ".release/sing-box/LICENSE" -Target "${{ matrix.target }}" -ExpectedSingBoxVersion "${{ needs.metadata.outputs.sing_box_version }}"

      - name: Stage Unix portable layout
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/stage.sh ".release/sing-box/core/sing-box" ".release/sing-box/LICENSE" "${{ matrix.target }}"

      - name: Package portable archive and manifest
        run: python scripts/package-portable.py --stage "dist/${{ matrix.target }}" --output "dist/artifacts" --cargo-lock "Cargo.lock" --sing-box-metadata ".release/sing-box/source.json" --target "${{ matrix.target }}" --platform-label "${{ matrix.platform_label }}" --version-code "${{ needs.metadata.outputs.version_code }}" --version-name "${{ needs.metadata.outputs.version_name }}" --git-commit "${{ needs.metadata.outputs.git_commit }}" --source-date-epoch "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Upload portable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ matrix.platform_label }}
          path: dist/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all portable archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set and write checksums
        shell: bash
        env:
          VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
        run: |
          set -euo pipefail
          expected_archives=(
            "topnode-desktop-${VERSION_NAME}-windows-x86_64.zip"
            "topnode-desktop-${VERSION_NAME}-windows-aarch64.zip"
            "topnode-desktop-${VERSION_NAME}-linux-x86_64.tar.gz"
            "topnode-desktop-${VERSION_NAME}-linux-aarch64.tar.gz"
            "topnode-desktop-${VERSION_NAME}-macos-x86_64.tar.gz"
            "topnode-desktop-${VERSION_NAME}-macos-aarch64.tar.gz"
          )
          for archive in "${expected_archives[@]}"; do
            if [[ ! -f "release-assets/${archive}" ]]; then
              echo "Missing portable archive: ${archive}" >&2
              exit 1
            fi
          done
          for archive in release-assets/*.zip; do
            unzip -tqq "${archive}"
          done
          for archive in release-assets/*.tar.gz; do
            tar -tzf "${archive}" > /dev/null
          done
          archive_count="$(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)"
          if [[ "${archive_count}" -ne 6 ]]; then
            echo "Expected six portable archives, found ${archive_count}" >&2
            exit 1
          fi
          cd release-assets
          sha256sum topnode-desktop-* > SHA256SUMS.txt

      - name: Create draft, upload assets, then publish
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
          VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          GIT_COMMIT: ${{ needs.metadata.outputs.git_commit }}
          SING_BOX_VERSION: ${{ needs.metadata.outputs.sing_box_version }}
        run: |
          set -euo pipefail
          notes="$(printf '%s\n\n%s\n%s\n%s\n%s\n' \
            "TOPNODE Desktop ${VERSION_NAME} (${VERSION_CODE})" \
            "Source commit: ${GIT_COMMIT}" \
            "Bundled sing-box: ${SING_BOX_VERSION}" \
            "Windows packages are supported. Linux and macOS packages are previews until system-proxy/TUN adapters are implemented." \
            "Generate the version object in the controlled deployment environment, then merge it into all three bootstrap documents; preserve production baseApiServer/apiProbe/fake/payment fields.")"
          if release_json="$(gh release view "${RELEASE_TAG}" --json isDraft,targetCommitish 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "${release_json}")" != "true" ]]; then
              echo "Published release already exists: ${RELEASE_TAG}" >&2
              exit 1
            fi
            if [[ "$(jq -r '.targetCommitish' <<< "${release_json}")" != "${GIT_COMMIT}" ]]; then
              echo "Existing draft targets a different Git commit" >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" --draft --target "${GIT_COMMIT}" --title "TOPNODE Desktop ${VERSION_NAME}" --notes "${notes}"
          fi
          gh release edit "${RELEASE_TAG}" --draft --target "${GIT_COMMIT}" --title "TOPNODE Desktop ${VERSION_NAME}" --notes "${notes}"
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
