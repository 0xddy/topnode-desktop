name: desktop-candidates

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Upload artifacts from a previous build run ID. Leave blank to build and upload.
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-portable-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Derive release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      git_commit: ${{ steps.version.outputs.git_commit }}
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      core_version: ${{ steps.version.outputs.core_version }}
      go_version: ${{ steps.version.outputs.go_version }}
      source_run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Resolve candidate source
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "Portable candidates must run from the default branch: ${expected_ref}" >&2
            exit 1
          fi
          run_id="${GITHUB_RUN_ID}"
          git_commit="${GITHUB_SHA}"
          if [[ -n "${REQUESTED_RUN_ID}" ]]; then
            if [[ ! "${REQUESTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo 'source_run_id must be a positive Actions run ID.' >&2
              exit 1
            fi
            run_id="${REQUESTED_RUN_ID}"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if ! git_commit="$(jq -er --arg repository "${GITHUB_REPOSITORY}" --arg branch "${DEFAULT_BRANCH}" '
              select(.status == "completed" and .event == "workflow_dispatch"
                and .path == ".github/workflows/portable-release.yml"
                and .head_repository.full_name == $repository and .head_branch == $branch)
              | .head_sha | select(test("^[0-9a-f]{40,64}$"))
            ' <<< "${run}")"; then
              echo 'Select a completed desktop-candidates run on the default branch.' >&2
              exit 1
            fi
          fi
          {
            echo "run_id=${run_id}"
            echo "git_commit=${git_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.git_commit }}

      - name: Derive Android-compatible Git version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "A complete Git history is required for versionCode" >&2
            exit 1
          fi
          version_code="$(git rev-list --count HEAD)"
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Git commit count is outside the supported versionCode range" >&2
            exit 1
          fi
          git_commit="$(git rev-parse HEAD)"
          commit_date="$(git show -s --format=%cs HEAD)"
          if [[ ! "${git_commit}" =~ ^[0-9a-f]{40,64}$ || ! "${commit_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Git returned invalid release metadata" >&2
            exit 1
          fi
          version_name="${commit_date//-/.}-${git_commit:0:8}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          release_tag="desktop-v${version_code}-${version_name}"
          {
            echo "version_code=${version_code}"
            echo "version_name=${version_name}"
            echo "git_commit=${git_commit}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "release_tag=${release_tag}"
            echo "core_version=$(sed -n 's/^version=//p' config/sing-box-acp.lock)"
            echo "go_version=$(sed -n 's/^go=//p' config/sing-box-acp.lock)"
          } >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify release source
    needs: metadata
    if: inputs.source_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPNODE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      TOPNODE_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      TOPNODE_GIT_COMMIT: ${{ needs.metadata.outputs.git_commit }}
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy

      - name: Install Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Validate release helpers
        run: |
          python3 -m py_compile scripts/build-sing-box-acp.py scripts/package-portable.py scripts/render-release-config.py scripts/publish-dufs.py
          python3 -m unittest discover -s scripts/tests -v

      - name: Format
        run: cargo fmt --all --check

      - name: Render release configuration for Rust contract tests
        shell: bash
        run: |
          cp config/desktop-config.json "${RUNNER_TEMP}/desktop-config.template.json"
          python3 scripts/render-release-config.py \
            --template "${RUNNER_TEMP}/desktop-config.template.json" \
            --output config/desktop-config.json \
            --download-base-url "https://soft.topstatic.top/soft/desktop/${{ needs.metadata.outputs.release_tag }}" \
            --version-code "${{ needs.metadata.outputs.version_code }}" \
            --version-name "${{ needs.metadata.outputs.version_name }}" \
            --update-info "Desktop portable release ${{ needs.metadata.outputs.version_name }}"

      - name: Test
        run: cargo test --workspace --exclude topnode-desktop --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.platform_label }}
    needs: [metadata, verify]
    if: inputs.source_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform_label: windows-x86_64
            rustflags: -C target-feature=+crt-static
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform_label: windows-aarch64
            rustflags: -C target-feature=+crt-static
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_label: linux-x86_64
            rustflags: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_label: linux-aarch64
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform_label: macos-x86_64
            rustflags: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            platform_label: macos-aarch64
            rustflags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TOPNODE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      TOPNODE_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      TOPNODE_GIT_COMMIT: ${{ needs.metadata.outputs.git_commit }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain and target
        run: rustup toolchain install 1.92.0 --profile minimal && rustup target add ${{ matrix.target }} --toolchain 1.92.0

      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.metadata.outputs.go_version }}
          cache: false

      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Build and check the ACP core on the target platform
        run: python scripts/build-sing-box-acp.py --target "${{ matrix.target }}" --output ".release/sing-box-acp" --require-native --with-naive

      - name: Build desktop application
        run: cargo build --release --locked -p topnode-desktop --target "${{ matrix.target }}"

      - name: Verify native TCP and UoT paths
        run: >-
          python scripts/verify-naive.py
          --core ".release/sing-box-acp/core/sing-box-acp${{ runner.os == 'Windows' && '.exe' || '' }}"
          --metadata .release/sing-box-acp/source.json
          --report .release/sing-box-acp/core/naive-validation.json

      - name: Build Linux restricted helper
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p topnode-net-helper --target "${{ matrix.target }}"

      - name: Build macOS platform helpers
        if: runner.os == 'macOS'
        run: python scripts/build-macos-support.py --target "${{ matrix.target }}" --output "target/${{ matrix.target }}/release"

      - name: Package portable archive and manifest
        run: >-
          python scripts/package-portable.py
          --application "target/${{ matrix.target }}/release/topnode-desktop${{ runner.os == 'Windows' && '.exe' || '' }}"
          --candidate --support-build "target/${{ matrix.target }}/release" --core-build ".release/sing-box-acp" --output "dist/artifacts" --cargo-lock "Cargo.lock"
          --target "${{ matrix.target }}" --platform-label "${{ matrix.platform_label }}"
          --version-code "${{ needs.metadata.outputs.version_code }}" --version-name "${{ needs.metadata.outputs.version_name }}"
          --git-commit "${{ needs.metadata.outputs.git_commit }}" --source-date-epoch "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Assemble Ubuntu installer candidate
        if: runner.os == 'Linux'
        run: >-
          python scripts/package-deb.py --candidate
          --application "target/${{ matrix.target }}/release/topnode-desktop"
          --support-build "target/${{ matrix.target }}/release"
          --core-build .release/sing-box-acp
          --target "${{ matrix.target }}" --version-name "${{ needs.metadata.outputs.version_name }}"
          --source-date-epoch "${{ needs.metadata.outputs.source_date_epoch }}"
          --output "dist/artifacts/topnode-desktop-${{ needs.metadata.outputs.version_name }}-${{ matrix.platform_label }}.deb"

      - name: Upload native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.platform_label }}
          path: .release/sing-box-acp/core/naive-validation.json

      - name: Upload portable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ matrix.platform_label }}
          path: dist/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-candidates:
    name: Upload desktop candidates to DUFS
    needs: [metadata, build]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && (needs.build.result == 'success' || (inputs.source_run_id != '' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      GIT_COMMIT: ${{ needs.metadata.outputs.git_commit }}
      SOURCE_RUN_ID: ${{ needs.metadata.outputs.source_run_id }}
    steps:
      - name: Check out upload script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download portable archives and Ubuntu installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.metadata.outputs.source_run_id }}
          pattern: portable-*
          path: candidate-assets
          merge-multiple: true

      - name: Upload and verify anonymous downloads
        shell: bash
        env:
          TOPNODE_DUFS_USERNAME: admin
          TOPNODE_DUFS_PASSWORD: ${{ secrets.TOPNODE_DUFS_PASSWORD }}
        run: |
          set -euo pipefail
          url="$(python3 scripts/publish-dufs.py upload-candidate \
            --assets candidate-assets \
            --version-code "${VERSION_CODE}" --version-name "${VERSION_NAME}" \
            --git-commit "${GIT_COMMIT}" --source-run-id "${SOURCE_RUN_ID}")"
          echo "Verified desktop candidates at ${url}"
          echo "[Desktop candidate downloads](${url})" >> "${GITHUB_STEP_SUMMARY}"
