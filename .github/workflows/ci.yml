name: desktop-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '12.0' || '13.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - name: Compile macOS service and proxy integration
        if: runner.os == 'macOS'
        run: python3 scripts/build-macos-support.py --target ${{ matrix.target }} --output .release/platform-check --test
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Test release helpers
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude topnode-desktop --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Intel macOS desktop
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo build --release --locked -p topnode-desktop --target ${{ matrix.target }}
      - name: Build Intel macOS ACP with Naive
        if: matrix.target == 'x86_64-apple-darwin'
        run: python3 scripts/build-sing-box-acp.py --target ${{ matrix.target }} --output .release/sing-box-acp --require-native --with-naive
      - name: Verify Intel macOS Naive TCP and UoT
        if: matrix.target == 'x86_64-apple-darwin'
        run: >-
          python3 scripts/verify-naive.py --core .release/sing-box-acp/core/sing-box-acp
          --metadata .release/sing-box-acp/source.json
          --report .release/sing-box-acp/core/naive-validation.json
      - name: Package Intel macOS compatibility candidate
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          python3 scripts/package-portable.py \
            --application target/${{ matrix.target }}/release/topnode-desktop \
            --core-build .release/sing-box-acp --support-build .release/platform-check \
            --output dist/macos-compatibility --cargo-lock Cargo.lock --candidate \
            --target ${{ matrix.target }} --platform-label macos-x86_64 \
            --version-code "$(git rev-list --count HEAD)" --version-name "12.7.6-test-$(git rev-parse --short=8 HEAD)" \
            --git-commit "$(git rev-parse HEAD)" --source-date-epoch "$(git show -s --format=%ct HEAD)"
      - name: Upload Intel macOS compatibility candidate
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-12-intel-candidate
          path: dist/macos-compatibility/*
          if-no-files-found: error
          compression-level: 0
