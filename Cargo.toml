[workspace]
members = [
    "apps/desktop",
    "crates/application",
    "crates/domain",
    "crates/infrastructure",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["TOPNODE"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
atomic-write-file = "0.3.1"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
copypasta = "0.10.2"
directories = "6.0"
fs2 = "0.4"
# Slint shares image 0.25 with the app. Enable only WebP for the embedded
# Android flag assets instead of enabling every optional image decoder.
image = { version = "0.25", default-features = false, features = ["webp"] }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
qrcode = { version = "=0.14.1", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10.9"
slint = { version = "=1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "std",
    "system-tray",
] }
slint-build = "=1.17.1"
thiserror = "2.0"
time = { version = "0.3.55", features = ["local-offset", "parsing"] }
tokio = { version = "1.47", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.1", features = ["v4"] }
webpki-roots = "1.0.9"
webbrowser = { version = "=1.2.4", default-features = false, features = ["hardened"] }
win-desktop-utils = { version = "=0.5.7", default-features = false, features = ["elevation"] }
x509-parser = "0.18.1"
zeroize = { version = "1.9", features = ["derive"] }

[workspace.dependencies.win32job]
version = "2.0.3"

[workspace.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_Networking_WinInet"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
